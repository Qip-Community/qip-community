<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Технические работы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Tahoma, sans-serif;
            background: #dce5f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 12px;
            border: 1px solid #b3c3d4;
            max-width: 500px;
        }
        h1 {
            font-size: 48px;
            color: #0d2f5e;
        }
        p {
            font-size: 18px;
            color: #333;
            margin-top: 10px;
        }
        .emoji {
            font-size: 60px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🔧</div>
        <h1>Технические работы</h1>
        <p>Сайт временно недоступен.<br />Мы проводим плановое обслуживание.</p>
        <p style="font-size:14px; color:#888; margin-top:20px;">Скоро всё заработает!</p>
    </div>
</body>
</html>
